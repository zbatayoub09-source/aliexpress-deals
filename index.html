<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="AliExpress Deals - trending products and special offers"><title>AliExpress Deals</title><script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script><style>:root{--red:#ff3b30;--dark:#151515;--muted:#6b7280;--bg:#f5f6f8;--card:#fff;--line:#e5e7eb}*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:var(--bg);color:#171717}.top{background:var(--dark);color:#fff;text-align:center;padding:10px;font-size:13px}.nav{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:10}.navin{max-width:1280px;margin:auto;padding:15px 20px;display:flex;align-items:center;gap:20px}.brand{font-size:24px;font-weight:900;white-space:nowrap}.brand span{color:var(--red)}.search{flex:1}.search input{width:100%;padding:13px 18px;border:1px solid #ddd;border-radius:25px;font-size:15px}.hero{max-width:1280px;margin:24px auto 18px;padding:0 20px}.heroBox{background:linear-gradient(120deg,#171717,#3a3a3a);border-radius:22px;color:#fff;padding:40px}.hero h1{margin:0 0 8px;font-size:38px}.hero p{margin:0;color:#d1d5db}.cats{max-width:1280px;margin:auto;padding:0 20px 18px;display:flex;gap:9px;overflow:auto}.cat{border:1px solid var(--line);background:#fff;border-radius:22px;padding:10px 16px;cursor:pointer;white-space:nowrap}.cat.active{background:#171717;color:#fff}.tools{max-width:1280px;margin:auto;padding:0 20px 15px;display:flex;justify-content:space-between;gap:12px}.sort{border:1px solid var(--line);background:#fff;padding:10px;border-radius:9px}.grid{max-width:1280px;margin:auto;padding:0 20px 45px;display:grid;grid-template-columns:repeat(4,1fr);gap:18px}.card{background:#fff;border:1px solid #eee;border-radius:16px;overflow:hidden;display:flex;flex-direction:column}.photo{height:245px;background:#eee}.photo img{width:100%;height:100%;object-fit:cover}.body{padding:14px;display:flex;flex-direction:column;flex:1}.title{font-size:14px;line-height:1.45;height:61px;overflow:hidden}.price{font-size:21px;font-weight:900;color:var(--red);margin-top:8px}.old{text-decoration:line-through;color:#999;font-size:12px;margin:4px 0 10px}.meta{font-size:12px;color:var(--muted);margin-bottom:12px}.deal{background:#171717;color:#fff;text-decoration:none;text-align:center;padding:12px;border-radius:9px;font-weight:800;margin-top:auto}.badge{position:absolute;top:10px;left:10px;background:var(--red);color:#fff;padding:6px 9px;border-radius:8px;font-size:12px;font-weight:bold}.loading,.empty{grid-column:1/-1;text-align:center;padding:65px;color:var(--muted)}footer{text-align:center;padding:28px;background:#fff;color:#888;font-size:12px}@media(max-width:1000px){.grid{grid-template-columns:repeat(3,1fr)}}@media(max-width:700px){.navin{padding:12px}.brand{font-size:20px}.hero{padding:0 10px;margin-top:14px}.heroBox{padding:28px 20px}.hero h1{font-size:29px}.cats,.tools,.grid{padding-left:10px;padding-right:10px}.grid{grid-template-columns:repeat(2,1fr);gap:10px}.photo{height:180px}.body{padding:10px}.title{font-size:12px;height:54px}.price{font-size:18px}.deal{font-size:12px;padding:10px}.tools{flex-direction:column}.sort{width:100%}}</style></head><body><div class="top">🔥 Featured deals • Prices and availability may change</div><nav class="nav"><div class="navin"><div class="brand">Ali<span>Express</span> Deals</div><div class="search"><input id="search" type="search" placeholder="Search products..."></div></div></nav><section class="hero"><div class="heroBox"><h1>Discover Great Deals</h1><p>Trending products, special offers and selected deals — all in one place.</p></div></section><div class="cats" id="cats"><button class="cat active" data-cat="all">All Products</button></div><div class="tools"><b id="count">Loading products...</b><select class="sort" id="sort"><option value="featured">Featured</option><option value="price">Price: Low to High</option><option value="discount">Biggest Discount</option><option value="sales">Most Sold</option></select></div><main class="grid" id="products"><div class="loading">Loading deals...</div></main><footer>Affiliate links • Independent deals website • Not the official AliExpress website.</footer><script>const API='https://api.github.com/repos/zbatayoub09-source/aliexpress-deals/contents/';let products=[],active='all',cats={all:'All Products'};function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}function num(v){return parseFloat(String(v||'').replace(/[^0-9.]/g,''))||0}function category(name){let x=name.toLowerCase();if(x.includes('electron'))return['electronics','📱 Electronics'];if(x.includes('bag')||x.includes('حقائب')||x.includes('أمتعة'))return['bags','👜 Bags & Luggage'];if(x.includes('wedding')||x.includes('زفاف')||x.includes('فعاليات'))return['wedding','💍 Wedding & Events'];if(x.includes('motorcycle')||x.includes('دراجات'))return['motorcycle','🏍️ Motorcycle'];if(x.includes('tool')||x.includes('dwaw'))return['tools','🔧 Tools'];return['other','📦 Other']}async function load(){try{let r=await fetch(API);if(!r.ok)throw Error('GitHub files error');let files=await r.json();let csvs=files.filter(x=>x.type==='file'&&x.name.toLowerCase().endsWith('.csv'));if(!csvs.length){show('No CSV files found in this repository.');return}let out=await Promise.all(csvs.map(async f=>{let [cat,label]=category(f.name);cats[cat]=label;try{let t=await fetch(f.download_url).then(x=>x.text());let d=Papa.parse(t,{header:true,skipEmptyLines:true}).data;return d.map(p=>({...p,category:cat,source:f.name}));}catch(e){return[]}}));products=out.flat().filter(p=>p['Image Url']&&(p['Promotion Url']||p['Promotion URL']||p['Link']||p['Product Url']));buildCats();render()}catch(e){show('Could not load the CSV files. Please check that GitHub Pages is enabled for main / root.')}}function buildCats(){let el=document.getElementById('cats');el.innerHTML=Object.entries(cats).map(([k,v])=>`<button class="cat ${k==='all'?'active':''}" data-cat="${k}">${v}</button>`).join('');el.querySelectorAll('.cat').forEach(b=>b.onclick=()=>{el.querySelectorAll('.cat').forEach(x=>x.classList.remove('active'));b.classList.add('active');active=b.dataset.cat;render()})}function render(){let q=document.getElementById('search').value.toLowerCase().trim();let list=products.filter(p=>active==='all'||p.category===active).filter(p=>(p['Product Desc']||p.Title||'').toLowerCase().includes(q));let s=document.getElementById('sort').value;if(s==='price')list.sort((a,b)=>num(a['Discount Price'])-num(b['Discount Price']));if(s==='discount')list.sort((a,b)=>num(b.Discount)-num(a.Discount));if(s==='sales')list.sort((a,b)=>num(b.Sales180Day)-num(a.Sales180Day));document.getElementById('count').textContent=list.length+' products';document.getElementById('products').innerHTML=list.length?list.map(card).join(''):'<div class="empty">No products found.</div>'}function card(p){let title=p['Product Desc']||p.Title||'Product';let img=p['Image Url']||p.Image;let link=p['Promotion Url']||p['Promotion URL']||p.Link||p['Product Url'];return `<article class="card"><div class="photo" style="position:relative"><img src="${esc(img)}" loading="lazy" onerror="this.style.opacity=.2"><span class="badge">-${esc(p.Discount||'0%')}</span></div><div class="body"><div class="title">${esc(title)}</div><div class="price">${esc(p['Discount Price']||p.Price||'')}</div><div class="old">Was ${esc(p['Origin Price']||'')}</div><div class="meta">⭐ ${esc(p['Positive Feedback']||'')} • 🛒 ${esc(p.Sales180Day||'0')} sold</div><a class="deal" href="${esc(link)}" target="_blank" rel="nofollow sponsored noopener">View Deal →</a></div></article>`}function show(t){document.getElementById('products').innerHTML='<div class="empty">'+t+'</div>';document.getElementById('count').textContent='';}document.getElementById('search').oninput=render;document.getElementById('sort').onchange=render;load();</script></body></html>
