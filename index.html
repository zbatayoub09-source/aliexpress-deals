<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AliExpress Deals</title>
<meta name="description" content="Discover selected AliExpress deals organized by category.">
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f6f7f9;color:#171717}.top{background:#111;color:#fff;text-align:center;padding:9px;font-size:13px}.nav{background:#fff;border-bottom:1px solid #e8e8e8;position:sticky;top:0;z-index:20}.navin{max-width:1350px;margin:auto;padding:14px 20px;display:flex;gap:20px;align-items:center}.logo{font-size:24px;font-weight:900;white-space:nowrap}.logo b{color:#ff3b30}.search{flex:1}.search input{width:100%;padding:13px 18px;border:1px solid #ddd;border-radius:25px;font-size:15px;outline:0}.cats{max-width:1350px;margin:auto;padding:18px 20px 10px;display:flex;gap:9px;overflow:auto}.cat{border:1px solid #ddd;background:#fff;border-radius:25px;padding:10px 16px;white-space:nowrap;cursor:pointer}.cat.active{background:#111;color:#fff;border-color:#111}.bar{max-width:1350px;margin:auto;padding:8px 20px 18px;display:flex;justify-content:space-between;align-items:center}.sort{padding:10px;border:1px solid #ddd;border-radius:8px;background:#fff}.grid{max-width:1350px;margin:auto;padding:0 20px 50px;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px}.card{background:#fff;border:1px solid #e7e7e7;border-radius:16px;overflow:hidden;display:flex;flex-direction:column;min-width:0;transition:.2s}.card:hover{transform:translateY(-3px);box-shadow:0 12px 28px #0001}.pic{height:245px;background:#eee;position:relative}.pic img{width:100%;height:100%;object-fit:cover;display:block}.badge{position:absolute;top:10px;left:10px;background:#ff3b30;color:#fff;border-radius:7px;padding:6px 8px;font-size:12px;font-weight:bold}.body{padding:14px;display:flex;flex-direction:column;flex:1}.title{font-size:14px;line-height:1.45;height:62px;overflow:hidden}.price{font-size:20px;font-weight:900;color:#e53935;margin-top:8px}.old{text-decoration:line-through;color:#999;font-size:12px;margin-top:4px}.meta{font-size:12px;color:#777;margin:10px 0 13px}.deal{margin-top:auto;text-align:center;text-decoration:none;background:#111;color:#fff;padding:12px;border-radius:9px;font-weight:bold}.deal:hover{background:#ff3b30}.msg{grid-column:1/-1;text-align:center;padding:80px 20px;color:#777}.error{grid-column:1/-1;background:#fff;border:1px solid #eee;border-radius:14px;padding:40px;text-align:center;color:#555;line-height:1.7}footer{text-align:center;background:#fff;border-top:1px solid #eee;padding:28px;color:#888;font-size:12px}@media(max-width:1050px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}@media(max-width:700px){.navin{flex-direction:column;padding:12px 10px}.logo{font-size:21px}.cats,.bar,.grid{padding-left:10px;padding-right:10px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.pic{height:180px}.body{padding:10px}.title{font-size:12px;height:55px}.price{font-size:17px}.deal{font-size:12px;padding:10px}.bar{flex-direction:column;align-items:stretch;gap:10px}.sort{width:100%}}
</style>
</head>
<body>
<div class="top">🔥 Selected deals • Prices and availability may change</div>
<nav class="nav"><div class="navin"><div class="logo">Ali<b>Express</b> Deals</div><div class="search"><input id="search" placeholder="Search products..." autocomplete="off"></div></div></nav>
<div class="cats" id="cats"><button class="cat active" data-c="all">All Products</button></div>
<div class="bar"><strong id="count">Loading catalog...</strong><select id="sort" class="sort"><option value="featured">Featured</option><option value="price">Price: Low to High</option><option value="discount">Biggest Discount</option><option value="sales">Most Sold</option></select></div>
<main class="grid" id="grid"><div class="msg">⏳ Loading all AliExpress files...</div></main>
<footer>Affiliate links • Independent deals website • Not the official AliExpress website.</footer>
<script>
const SOURCE='https://api.github.com/repos/zbatayoub09-source/deala-aliexpress/contents/?ref=main';
let products=[],active='all';
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
const num=v=>parseFloat(String(v??'').replace(/[^0-9.]/g,''))||0;
function category(name){const n=name.toLowerCase();if(n.includes('electron')||n.includes('électron'))return['electronics','📱 Electronics'];if(n.includes('outil')||n.includes('tool')||n.includes('dwaw')||n.includes('الأدوات'))return['tools','🔧 Tools'];if(n.includes('bag')||n.includes('luggage')||n.includes('الأمتعة')||n.includes('الحقائب'))return['bags','👜 Bags & Luggage'];if(n.includes('wedding')||n.includes('زفاف')||n.includes('حفلات'))return['wedding','💍 Wedding & Events'];if(n.includes('motorcycle')||n.includes('دراجات'))return['motorcycle','🏍️ Motorcycle'];if(n.includes('car')||n.includes('auto')||n.includes('سيارة')||n.includes('سيارات'))return['cars','🚗 Cars & Parts'];if(n.includes('shoe')||n.includes('أحذية'))return['shoes','👟 Shoes'];if(n.includes('mother')||n.includes('baby')||n.includes('children')||n.includes('الأم')||n.includes('الأطفال'))return['kids','👶 Mother & Kids'];if(n.includes('furniture')||n.includes('الأثاث'))return['furniture','🛋️ Furniture'];return['other','📦 Other'];}
function isCNC(name){const n=name.toLowerCase();return n.includes('cnc')||n.includes('aspire')||n.includes('vcarve')||n.includes('router design')||n.includes('gcode');}
function fields(r){const keys=Object.keys(r);const get=names=>{for(const x of names){const k=keys.find(k=>k.trim().toLowerCase()===x.toLowerCase());if(k&&r[k]!=null&&String(r[k]).trim())return r[k]}return''};return{title:get(['Product Desc','Title','Product Name','Product Description']),image:get(['Image Url','Image URL','Image','Product Image']),link:get(['Promotion Url','Promotion URL','Affiliate Link','Product Url','Link']),price:get(['Discount Price','Price']),old:get(['Origin Price','Original Price']),discount:get(['Discount']),sales:get(['Sales180Day']),rating:get(['Positive Feedback']),id:get(['ProductId','Product ID','ID'])};}
async function getFiles(){const r=await fetch(SOURCE);if(!r.ok)throw new Error('Could not access the deala-aliexpress repository.');return (await r.json()).filter(f=>f.type==='file'&&!isCNC(f.name)&&/\.(csv|xlsx|xls)$/i.test(f.name));}
async function readFile(f){try{const buf=await fetch(f.download_url).then(r=>{if(!r.ok)throw new Error();return r.arrayBuffer()});let rows=[];if(/\.csv$/i.test(f.name)){const text=new TextDecoder('utf-8').decode(buf);const wb=XLSX.read(text,{type:'string'});rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{defval:''});}else{const wb=XLSX.read(buf,{type:'array'});rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{defval:''});}const [cat,label]=category(f.name);return rows.map(r=>{const p=fields(r);return{...p,category:cat,label,source:f.name}}).filter(p=>p.title&&p.image&&p.link);}catch(e){return[]}}
async function load(){try{document.getElementById('grid').innerHTML='<div class="msg">⏳ Finding all AliExpress files...</div>';const files=await getFiles();if(!files.length)throw new Error('No AliExpress CSV/XLSX files found.');const chunks=await Promise.all(files.map(readFile));const raw=chunks.flat();const seen=new Set();products=raw.filter(p=>{const key=(p.id||p.link||p.title).toString().trim().toLowerCase();if(!key||seen.has(key))return false;seen.add(key);return true});buildCats();render();}catch(e){document.getElementById('grid').innerHTML='<div class="error">❌ '+esc(e.message)+'</div>';document.getElementById('count').textContent='';}}
function buildCats(){const labels={all:'🛍️ All Products'};products.forEach(p=>labels[p.category]=p.label);document.getElementById('cats').innerHTML=Object.entries(labels).map(([k,v])=>`<button class="cat ${k===active?'active':''}" data-c="${esc(k)}">${esc(v)}</button>`).join('');document.querySelectorAll('.cat').forEach(b=>b.onclick=()=>{active=b.dataset.c;document.querySelectorAll('.cat').forEach(x=>x.classList.remove('active'));b.classList.add('active');render()});}
function render(){const q=document.getElementById('search').value.toLowerCase().trim();let list=products.filter(p=>(active==='all'||p.category===active)&&p.title.toLowerCase().includes(q));const s=document.getElementById('sort').value;if(s==='price')list.sort((a,b)=>num(a.price)-num(b.price));if(s==='discount')list.sort((a,b)=>num(b.discount)-num(a.discount));if(s==='sales')list.sort((a,b)=>num(b.sales)-num(a.sales));document.getElementById('count').textContent=list.length+' products';document.getElementById('grid').innerHTML=list.length?list.map(card).join(''):'<div class="msg">No products found.</div>';}
function card(p){return`<article class="card"><div class="pic"><img src="${esc(p.image)}" alt="${esc(p.title)}" loading="lazy" onerror="this.style.opacity='.15'"><span class="badge">-${esc(p.discount||'0%')}</span></div><div class="body"><div class="title">${esc(p.title)}</div><div class="price">${esc(p.price)}</div><div class="old">Was ${esc(p.old)}</div><div class="meta">⭐ ${esc(p.rating)} &nbsp; • &nbsp; 🛒 ${esc(p.sales)} sold</div><a class="deal" href="${esc(p.link)}" target="_blank" rel="nofollow sponsored noopener">View Deal →</a></div></article>`}
document.getElementById('search').addEventListener('input',render);document.getElementById('sort').addEventListener('change',render);load();
</script>
</body>
</html>
